<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Simulador de Test - TAI</title>
    <style>
        :root {
            --correcto: #2ecc71;
            --incorrecto: #e74c3c;
            --primario: #3498db;
            --gris: #f4f6f7;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--gris); margin: 0; padding: 20px; color: #2c3e50; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .oculto { display: none; }
        
        /* Pantalla de Configuración */
        .selector-temas { display: grid; gap: 10px; margin: 15px 0; }
        .input-cantidad { width: 100%; padding: 10px; box-sizing: border-box; border: 2px solid #bdc3c7; border-radius: 5px; font-size: 16px; margin-bottom: 20px; }
        .btn-principal { background: var(--primario); color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .btn-principal:hover { filter: brightness(0.9); }
        
        /* Pantalla de Juego */
        .card-pregunta { margin-top: 20px; }
        .opcion { display: block; background: #fff; border: 2px solid #bdc3c7; padding: 15px; margin: 10px 0; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .opcion:hover { background: #eaeded; }
        
        /* Clases de estado (Colores) */
        .opcion.correcta { background-color: var(--correcto) !important; color: white; border-color: #27ae60; }
        .opcion.incorrecta { background-color: var(--incorrecto) !important; color: white; border-color: #c0392b; }
        
        /* Checkbox Dudoso */
        .duda-container { background: #fef9e7; border: 1px solid #f5b041; padding: 12px; margin: 15px 0; border-radius: 6px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .actions { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Simulador de Test Oposiciones</h1>
    <hr>

    <div id="pantalla-config">
        <h2>1. Selecciona los Temas</h2>
        <div class="selector-temas" id="lista-temas">
            </div>

        <h2>2. Número de preguntas del test</h2>
        <input type="number" id="num-preguntas" class="input-cantidad" value="6" min="1">

        <h2>3. Opciones de Generación</h2>
        <button class="btn-principal" onclick="iniciarTest()">Generar Test Aleatorio</button>
        <button class="btn-principal" onclick="iniciarTestFalladas()" style="background:#e67e22; margin-top: 10px;">Repasar Falladas/Dudosas</button>
    </div>

    <div id="pantalla-test" class="oculto">
        <div style="display: flex; justify-content: space-between; font-weight: bold;">
            <span id="info-progreso">Pregunta 1 de X</span>
            <span id="info-tema" style="color: var(--primario);">Tema</span>
        </div>
        
        <div class="card-pregunta">
            <h3 id="texto-pregunta">Aquí irá el enunciado de la pregunta</h3>
            <div id="contenedor-opciones">
                </div>
        </div>

        <div class="duda-container">
            <input type="checkbox" id="chk-duda" style="transform: scale(1.3);">
            <label for="chk-duda">🤔 No estoy seguro (Se guardará para repasar aunque acierte)</label>
        </div>

        <div class="actions">
            <button id="btn-siguiente" class="btn-principal oculto" onclick="siguientePregunta()">Siguiente Pregunta ➡️</button>
        </div>
    </div>
</div>

// --- VARIABLES DE ESTADO ---
let preguntasActuales = [];
let indiceActual = 0;
let respondido = false;

// Al cargar la página, listamos los temas disponibles
window.onload = function() {
    const listaTemasDiv = document.getElementById('lista-temas');
    Object.keys(bancoPreguntas).forEach(tema => {
        listaTemasDiv.innerHTML += `
            <label style="background: #eaeded; padding: 10px; border-radius: 5px; cursor:pointer; display:block;">
                <input type="checkbox" name="temas" value="${tema}" checked> ${tema}
            </label>
        `;
    });
};

// Configurar test normal basado en selección de temas y cantidad equitativa
function iniciarTest() {
    const checkboxes = document.querySelectorAll('input[name="temas"]:checked');
    const cantidadTotalSolicitada = parseInt(document.getElementById('num-preguntas').value);
    
    if (checkboxes.length === 0) return alert("Selecciona al menos un tema");
    if (isNaN(cantidadTotalSolicitada) || cantidadTotalSolicitada < 1) return alert("Introduce una cantidad válida de preguntas");

    let temasSeleccionados = Array.from(checkboxes).map(cb => cb.value);
    let totalTemas = temasSeleccionados.length;

    // Calcular cuántas preguntas base tocan por tema
    let preguntasPorTema = Math.floor(cantidadTotalSolicitada / totalTemas);
    let resto = cantidadTotalSolicitada % totalTemas; // Lo sobrante por divisiones inexactas

    preguntasActuales = [];

    // Estructura temporal para guardar las preguntas elegidas por tema antes de juntarlas
    let bolsaPreguntasFinales = [];

    temasSeleccionados.forEach((tema, index) => {
        // Clonamos y mezclamos de forma aleatoria las preguntas de este tema concreto
        let preguntasDelTemaMezcladas = [...bancoPreguntas[tema]].sort(() => Math.random() - 0.5);
        
        // Si el 'resto' aún tiene elementos, a este tema le sumamos 1 pregunta extra
        let cuotaActual = preguntasPorTema + (index < resto ? 1 : 0);

        // Sacamos las preguntas que necesitamos para rellenar la cuota
        let seleccionadas = preguntasDelTemaMezcladas.slice(0, cuotaActual);
        bolsaPreguntasFinales = bolsaPreguntasFinales.concat(seleccionadas);
    });

    // Validar si el banco tiene suficientes preguntas en total
    if (bolsaPreguntasFinales.length < cantidadTotalSolicitada) {
        alert(`Aviso: No hay suficientes preguntas totales en los temas elegidos. Se han generado las ${bolsaPreguntasFinales.length} disponibles.`);
    }

    // Volvemos a mezclar el bloque total para que no salgan ordenadas por temas (primero todas las del tema 1 y luego las del tema 2)
    preguntasActuales = bolsaPreguntasFinales.sort(() => Math.random() - 0.5);
    
    comenzarBucleTest();
}

// Configurar test usando SOLO las falladas/dudosas del localStorage
function iniciarTestFalladas() {
    let falladas = JSON.parse(localStorage.getItem('falladasTAI')) || [];
    if (falladas.length === 0) return alert("¡Enhorabuena! No tienes preguntas falladas o dudosas guardadas.");
    
    // Las mezclamos para repasar de forma aleatoria
    preguntasActuales = falladas.sort(() => Math.random() - 0.5);
    comenzarBucleTest();
}

function comenzarBucleTest() {
    indiceActual = 0;
    document.getElementById('pantalla-config').classList.add('oculto');
    document.getElementById('pantalla-test').classList.remove('oculto');
    mostrarPregunta();
}

function mostrarPregunta() {
    respondido = false;
    document.getElementById('btn-siguiente').classList.add('oculto');
    document.getElementById('chk-duda').checked = false;
    
    const p = preguntasActuales[indiceActual];
    document.getElementById('info-progreso').innerText = `Pregunta ${indiceActual + 1} de ${preguntasActuales.length}`;
    document.getElementById('texto-pregunta').innerText = p.pregunta;
    
    // Buscar a qué tema pertenece esta pregunta para mostrarlo en interfaz
    let nombreTema = "Personalizado";
    for(let tema in bancoPreguntas){
        if(bancoPreguntas[tema].some(x => x.id === p.id)) nombreTema = tema;
    }
    document.getElementById('info-tema').innerText = nombreTema;

    // Renderizar opciones
    const contenedor = document.getElementById('contenedor-opciones');
    contenedor.innerHTML = '';
    
    Object.entries(p.opciones).forEach(([letra, texto]) => {
        contenedor.innerHTML += `
            <div class="opcion" data-letra="${letra}" onclick="verificarRespuesta(this)">
                <strong>${letra.toUpperCase()})</strong> ${texto}
            </div>
        `;
    });
}

function verificarRespuesta(elementoSeleccionado) {
    if (respondido) return; 
    respondido = true;

    const p = preguntasActuales[indiceActual];
    const letraSeleccionada = elementoSeleccionado.getAttribute('data-letra');
    const opcionesDivs = document.querySelectorAll('.opcion');
    const esDudosa = document.getElementById('chk-duda').checked;

    opcionesDivs.forEach(div => {
        const letra = div.getAttribute('data-letra');
        if (letra === p.correcta) {
            div.classList.add('correcta'); 
        }
        if (letra === letraSeleccionada && letraSeleccionada !== p.correcta) {
            div.classList.add('incorrecta'); 
        }
    });

    if (letraSeleccionada !== p.correcta || esDudosa) {
        guardarPreguntaFallada(p);
    } else {
        eliminarDeFalladas(p.id);
    }

    document.getElementById('btn-siguiente').classList.remove('oculto');
}

function guardarPreguntaFallada(pregunta) {
    let falladas = JSON.parse(localStorage.getItem('falladasTAI')) || [];
    if (!falladas.some(p => p.id === pregunta.id)) {
        falladas.push(pregunta);
        localStorage.setItem('falladasTAI', JSON.stringify(falladas));
    }
}

function eliminarDeFalladas(id) {
    let falladas = JSON.parse(localStorage.getItem('falladasTAI')) || [];
    falladas = falladas.filter(p => p.id !== id);
    localStorage.setItem('falladasTAI', JSON.stringify(falladas));
}

function siguientePregunta() {
    indiceActual++;
    if (indiceActual < preguntasActuales.length) {
        mostrarPregunta();
    } else {
        alert("¡Has terminado este bloque de preguntas!");
        document.getElementById('pantalla-test').classList.add('oculto');
        document.getElementById('pantalla-config').classList.remove('oculto');
    }
}
